<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Privag benchmark page</title>
  <!-- Synthetic values only. "Next" moves the photo one more pixel to the right on every click, so each step's
       frame differs and the vision pass really runs (unchanged pixels would be served from its cache). -->
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px 28px; background: #fff; color: #111; }
    .row { font-size: 22px; margin: 14px 0; }
    input { font-size: 18px; padding: 5px; width: 240px; }
    button { font-size: 18px; padding: 5px 12px; }
    #photo { display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Account overview</h1>
  <div class="row">Aadhaar: 2345 6789 0124 &nbsp; PAN: ABCPE1234F</div>
  <div class="row">Card: 4111 1111 1111 1111 &nbsp; Mobile: 98765 43210</div>
  <div class="row">Email: ravi.kumar@example.com &nbsp; UPI: ravi.kumar@okicici</div>
  <div class="row">
    <input type="password" value="benchmark-secret" aria-label="Password">
    <input type="email" value="ravi.kumar@example.com" aria-label="Email">
  </div>
  <div class="row">
    <button id="next" aria-label="Next">Next</button> <span id="caption">Step 0</span>
    <img id="photo" alt="Team photo" src="face.jpg" width="240" height="320">
  </div>
  <script>
    let step = 0;
    document.getElementById('next').addEventListener('click', () => {
      step++;
      document.getElementById('caption').textContent = `Step ${step}`;
      document.getElementById('photo').style.marginLeft = `${step}px`;
    });
  </script>
</body>
</html>
